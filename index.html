<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta
      name="description"
      content="Explainable synthetic MSME credit intelligence, financial twins and traceable cash-flow simulations."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080D18" />
    <script>
      try {
        var t = localStorage.getItem("saakh-theme") || "system";
        document.documentElement.dataset.theme =
          t === "system"
            ? matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark"
            : t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <title>Saakh 4.0 — Business Operations & Credit Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
