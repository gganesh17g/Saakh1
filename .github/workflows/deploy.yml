name: Deploy Saakh to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "26"
          cache: npm
      - name: Read GitHub Pages metadata
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and component regression tests
        run: npm test
      - name: Build production artifact
        env:
          SAAKH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SAAKH_RELEASE_SHA: ${{ github.sha }}
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Business and credit browser regression tests
        run: npm run test:e2e
      - name: Verify built artifact at the Pages path
        env:
          SAAKH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run test:pages
      - name: Upload built Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
